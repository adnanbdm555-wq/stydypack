  <h1>Data Migration to Firestore</h1>
  <p>Status: <span id="status">Loading data...</span></p>
  <button id="startBtn" disabled>Start Migration</button>

  <!-- Load the massive BOOKS array -->
  <script src="assets/js/main.js?v=10"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3cl7bxjuLoILxck4di-w6fLw4aRXHb9M",
      authDomain: "study-pack-store.firebaseapp.com",
      projectId: "study-pack-store",
      storageBucket: "study-pack-store.firebasestorage.app",
      messagingSenderId: "346606609514",
      appId: "1:346606609514:web:31ca9e21967e6b1d4f5613"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    if (typeof BOOKS !== 'undefined') {
        statusEl.innerText = `Loaded ${BOOKS.length} products. Ready to migrate.`;
        startBtn.disabled = false;
    } else {
        statusEl.innerText = "Error: BOOKS array not found.";
    }

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        statusEl.innerText = "Migrating... Please do not close this tab.";
        
        let batch = db.batch();
        let count = 0;
        let total = 0;
        const limit = 400; // Firebase batch limit is 500, using 400 to be safe
        
        try {
            for (let i = 0; i < BOOKS.length; i++) {
                const docRef = db.collection('products').doc(String(BOOKS[i].id));
                batch.set(docRef, BOOKS[i]);
                count++;
                total++;

                if (count >= limit || i === BOOKS.length - 1) {
                    statusEl.innerText = `Committing batch... (${total} / ${BOOKS.length})`;
                    await batch.commit();
                    batch = db.batch();
                    count = 0;
                }
            }
            
            // Also create some dummy orders
            const orders = [
                {id: 1001, customer: 'John Doe', email: 'john@example.com', date: Date.now() - 5000000, status: 'Processing', total: 45.00, items: [{title: 'Modern Web Design', qty: 1, price: 45.00}]},
                {id: 1002, customer: 'Jane Smith', email: 'jane@example.com', date: Date.now() - 90000000, status: 'Completed', total: 100.00, items: [{title: 'Introduction to Algorithms', qty: 1, price: 85.00}, {title: 'The Great Gatsby', qty: 1, price: 15.00}]}
            ];
            for (let o of orders) {
                await db.collection('orders').doc(String(o.id)).set(o);
            }
            
            statusEl.innerText = `Migration Complete! Successfully uploaded ${total} products and demo orders.`;
            statusEl.style.color = "green";
        } catch (e) {
            console.error(e);
            statusEl.innerText = "Error: " + e.message;
            statusEl.style.color = "red";
        }
    });
  </script>
