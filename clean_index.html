<!-- Mobile Nav JS -->

<script>

document.addEventListener("DOMContentLoaded", function() {

  const topBurger = document.getElementById("topBurger");

  const glassMenu = document.getElementById("glassMenu");

  const glassCloseBtn = document.getElementById("glassCloseBtn");

  

  if(topBurger && glassMenu) {

    const burgerIcon = topBurger.querySelector("svg");

    let menuOpen = false;



    function closeMenu() {

      menuOpen = false;

      glassMenu.classList.remove("open");

      burgerIcon.innerHTML = '<path d="M3 12h18M3 6h18M3 18h18"/>';

    }



    function openMenu() {

      menuOpen = true;

      glassMenu.classList.add("open");

      burgerIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';

    }



    topBurger.addEventListener("click", function(e) {

      createRipple(e, topBurger);

      if(menuOpen) closeMenu();

      else openMenu();

    });



    if(glassCloseBtn) {

      glassCloseBtn.addEventListener("click", function(e) {

        createRipple(e, glassCloseBtn);

        closeMenu();

      });

    }

  }



  const gmLinks = document.querySelectorAll(".gm-link");

  gmLinks.forEach(link => {

    link.addEventListener("click", function(e) {

      createRipple(e, link);

    });

  });



  function createRipple(event, element) {

    const circle = document.createElement("span");

    const diameter = Math.max(element.clientWidth, element.clientHeight);

    const radius = diameter / 2;

    circle.style.width = circle.style.height = `${diameter}px`;

    

    const rect = element.getBoundingClientRect();

    const x = event.clientX - rect.left - radius;

    const y = event.clientY - rect.top - radius;

    

    circle.style.left = `${x}px`;

    circle.style.top = `${y}px`;

    circle.classList.add("ripple");

    

    const existing = element.querySelector(".ripple");

    if(existing) existing.remove();

    

    element.appendChild(circle);

  }

});

</script>



<!-- Accordion JS -->

<script>

document.addEventListener("DOMContentLoaded", function() {

  const accHeads = document.querySelectorAll(".acc-head");

  accHeads.forEach(head => {

    head.addEventListener("click", function() {

      const parent = this.parentElement;

      parent.classList.toggle("active");

    });

  });



  const filterSearch = document.getElementById("filterSearch");

  if(filterSearch) {

    filterSearch.addEventListener("input", function(e) {

      const val = e.target.value.toLowerCase();

      const labels = document.querySelectorAll(".acc-body .glass-check");

      labels.forEach(label => {

        if(label.innerText.toLowerCase().includes(val)) {

          label.style.display = "flex";

        } else {

          label.style.display = "none";

        }

      });

    });

  }

  

  const checkBoxes = document.querySelectorAll(".glass-check input");

  checkBoxes.forEach(cb => {

    cb.addEventListener("change", function() {

      const parentAcc = this.closest(".accordion-item");

      if(parentAcc) {

        const badge = parentAcc.querySelector(".acc-badge");

        if(badge) {

          const checkedCount = parentAcc.querySelectorAll("input:checked:not([value='all'])").length;

          badge.innerText = checkedCount;

          if(checkedCount > 0) badge.classList.add("show");

          else badge.classList.remove("show");

        }

      }

    });

  });

  

  const closeFilterMobile = document.getElementById("closeFilterMobile");

  if(closeFilterMobile) {

    closeFilterMobile.addEventListener("click", () => {

      const card = document.getElementById("filterCard");

      if(card) card.classList.remove("show");

    });

  }



  const mobileFilterBtn = document.getElementById("mobileFilterBtn");

  if(mobileFilterBtn) {

    mobileFilterBtn.addEventListener("click", () => {

      const card = document.getElementById("filterCard");

      if(card) card.classList.add("show");

    });

  }

});

</script>
